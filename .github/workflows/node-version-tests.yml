name: Node.js Version Tests
on: [push, pull_request]

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['16', '18', '20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install deps
        run: |
          pip install jinja2
          npm install ws

      - name: Build client
        run: python3 builder.py --no-compile -e test-key

      - name: Help menu
        run: node client.js -h

      - name: Connect to shim
        run: |
          node test_shim.js 9999 &
          SHIM_PID=$!
          sleep 1
          timeout 10 node client.js --server-url ws://127.0.0.1:9999 --encryption-key test-key --retry-attempts 0 || true
          kill $SHIM_PID 2>/dev/null || true
